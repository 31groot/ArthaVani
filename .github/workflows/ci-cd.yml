name: ArthaVani CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arthavani
          POSTGRES_PASSWORD: arthavani
          POSTGRES_DB: arthavani
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arthavani -d arthavani"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python sources
        run: |
          python -m compileall api config finance_agent tests

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://arthavani:arthavani@localhost:5432/arthavani
          CONVERSATION_USER_ID: ci-user
          CONVERSATION_ID: ci
        run: |
          pytest -q tests

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: arthavani-frontend
          path: frontend/dist
          retention-days: 7
